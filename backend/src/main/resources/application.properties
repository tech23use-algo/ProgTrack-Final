spring.config.import=optional:file:.env[.properties]
spring.application.name=goal-tracker
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/goal_tracker?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
app.jwt.expiration-ms=86400000
app.cors.origin=${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}
groq.api-key=${GROQ_API_KEY:}
groq.base-url=https://api.groq.com/openai/v1
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.temperature=0.2
groq.timeout-seconds=30
