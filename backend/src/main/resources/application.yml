spring:
  application:
    name: openspace-skill-planner
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/openspace}
    username: ${DB_USERNAME:openspace}
    password: ${DB_PASSWORD:openspace}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT:8080}
  shutdown: graceful

openspace:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  auth:
    api-key: ${OPENSPACE_API_KEY:}

groq:
  endpoint: https://api.groq.com/openai/v1/chat/completions
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  temperature: 0.2
  max-tokens: ${GROQ_MAX_TOKENS:8192}
  timeout: 30s

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:openspace;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
